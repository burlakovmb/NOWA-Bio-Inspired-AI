role_id: procurement
display_name: Procurement Manager
event_classifier: nowa_roles.procurement.event_classifier:classify_procurement_events
token_rules:
  generic_tokens: false
mcp_capabilities:
- &id003
  tool_id: mcp__drivemcp__get_stock_levels
  server_name: drivemcp
  display_name: get_stock_levels
  description: 'READ: остатки номенклатуры Drive (InventoryInWarehouses + ReorderPointSettings
    + входящие PurchaseOrders). Envelope NOWA: status, stock.{sku}.{quantity,reorder_point,below_reorder_point,inbound,projected_quantity,base_demand_per_day}.'
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
  poll: true
  action_types: []
  input_schema:
    type: object
    properties:
      sku:
        type: string
        description: GUID ссылки Catalog.Products. Пусто — все позиции.
      maxItems:
        type: number
        description: Максимальное количество SKU в ответе
        default: 200
- &id004
  tool_id: mcp__drivemcp__get_suppliers
  server_name: drivemcp
  display_name: get_suppliers
  description: 'READ: поставщики Drive (Counterparties.Supplier) и цены (CounterpartyPrices).
    Envelope NOWA: status, suppliers.{id}.{reliability,unit_price,lead_time_days,reputation,is_defaulted,status,offers}.'
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
  poll: true
  action_types: []
  input_schema:
    type: object
    properties:
      supplier_id:
        type: string
        description: GUID ссылки Catalog.Counterparties. Пусто — все поставщики.
      maxItems:
        type: number
        description: Максимальное количество поставщиков в ответе
        default: 200
- &id005
  tool_id: mcp__drivemcp__get_budget
  server_name: drivemcp
  display_name: get_budget
  description: 'READ: свободные деньги Drive (CashAssets.Amount) и загрузка бюджета
    (CashBudget за период). Envelope NOWA: status, remaining, utilization_ratio.'
  risk_level: read_only
  domain_tags:
  - finance
  - procurement
  requires_approval: false
  poll: true
  action_types: []
  input_schema:
    type: object
    properties:
      period_start:
        type: string
        description: Начало периода оборотов CashBudget (ISO-дата). По умолчанию —
          начало текущего месяца.
      period_end:
        type: string
        description: Конец периода оборотов CashBudget (ISO-дата). По умолчанию —
          конец текущего месяца.
- &id006
  tool_id: mcp__drivemcp__create_purchase_order
  server_name: drivemcp
  display_name: create_purchase_order
  description: 'WRITE: создаёт Document.PurchaseOrder в 1C:Drive. Envelope NOWA: status=accepted|error,
    params, document_number, document_ref.'
  risk_level: medium_write
  domain_tags:
  - procurement
  requires_approval: false
  action_types:
  - mcp__drivemcp__create_purchase_order
  input_schema:
    type: object
    properties:
      supplier_id:
        type: string
        description: GUID ссылки Catalog.Counterparties
      product_id:
        type: string
        description: GUID ссылки Catalog.Products. Синоним параметра sku.
      sku:
        type: string
        description: Синоним product_id — GUID ссылки Catalog.Products.
      qty:
        type: number
        description: Количество заказа
      strategy:
        type: string
        description: Метаданные решения NOWA (пишется в Comment, Drive не интерпретирует).
      confidence:
        type: number
        description: Уверенность решения NOWA (пишется в Comment).
      post:
        type: boolean
        description: Провести документ после записи. По умолчанию false — только запись.
        default: false
    required:
    - supplier_id
    - sku
    - qty
- &id007
  tool_id: mcp__drivemcp__get_reorder_points
  server_name: drivemcp
  display_name: get_reorder_points
  description: 'READ: точка заказа (PricingBalanceMin) и максимальный запас (PricingBalanceMax).
    Ключ словаря — UUID ссылки Products. Envelope: status, reorder_points.{uuid}.{ref,sku,code,description,quantity,reorder_point,max_stock,below_reorder_point,inbound,projected_quantity,remaining_capacity,suggested_qty,default_supplier_id,default_supplier_ref}.
    Триггер: below_reorder_point=true.'
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
  poll: true
  action_types: []
  input_schema:
    type: object
    properties: &id001
      sku:
        type: string
        description: GUID ссылки Catalog.Products. Пусто — все позиции.
      maxItems:
        type: number
        description: Максимальное количество SKU в ответе
        default: 200
- &id008
  tool_id: mcp__drivemcp__get_replenishment_needs
  server_name: drivemcp
  display_name: get_replenishment_needs
  description: 'READ / основной триггер закупки: только номенклатура ниже точки заказа
    с suggested_qty>0. Ключ словаря — UUID ссылки Products. Envelope: status, needs_replenishment,
    items.{uuid}.{ref,sku,code,description,quantity,reorder_point,max_stock,suggested_qty,remaining_capacity,default_supplier_id,default_supplier_ref}.'
  risk_level: read_only
  domain_tags:
  - procurement
  requires_approval: false
  poll: true
  action_types: []
  input_schema:
    type: object
    properties: &id002
      sku:
        type: string
        description: GUID ссылки Catalog.Products. Пусто — все позиции ниже точки
          заказа.
      maxItems:
        type: number
        description: Максимальное количество SKU в ответе
        default: 200
