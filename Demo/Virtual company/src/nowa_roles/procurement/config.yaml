- server_id: drivemcp
  display_name: Drive MCP
  transport: http
  enabled: true
  command: ''
  args: []
  url: http://localhost/DriveDemo/hs/mcp
  username: suport
  password: ''
  catalog:
  - tool_id: mcp__drivemcp__list_metadata_objects
    server_name: drivemcp
    display_name: list_metadata_objects
    description: Получение списка объектов метаданных конфигурации с возможностью
      фильтрации по типу и имени
    input_schema:
      type: object
      properties:
        metaType:
          type: string
          description: Тип объекта метаданных
          enum:
          - Catalogs
          - Documents
          - InformationRegisters
          - AccumulationRegisters
          - AccountingRegisters
          - CalculationRegisters
          - ChartsOfCharacteristicTypes
          - ChartsOfAccounts
          - ChartsOfCalculationTypes
          - BusinessProcesses
          - Tasks
          - ExchangePlans
          - FilterCriteria
          - Reports
          - DataProcessors
          - Enums
          - CommonModules
          - SessionParameters
          - CommonTemplates
          - CommonPictures
          - XDTOPackages
          - WebServices
          - HTTPServices
          - WSReferences
          - Styles
          - Languages
          - FunctionalOptions
          - FunctionalOptionsParameters
          - DefinedTypes
          - CommonAttributes
          - CommonCommands
          - CommandGroups
          - Constants
          - CommonForms
          - Roles
          - Subsystems
          - EventSubscriptions
          - ScheduledJobs
          - SettingsStorages
          - Sequences
          - DocumentJournals
          - ExternalDataSources
          - Interfaces
        nameMask:
          type: string
          description: Маска имени объекта. Проверяется на вхождение подстроки в имя
            или синоним объекта.
        maxItems:
          type: number
          description: Максимальное количество возвращаемых результатов
          default: 100
      required:
      - metaType
    domain_tags: []
  - tool_id: mcp__drivemcp__get_metadata_structure
    server_name: drivemcp
    display_name: get_metadata_structure
    description: 'Структура объекта метаданных: поля, ТЧ, владельцы, предопределенные,
      значения перечисления. Для документов — список регистров движений. Опционально
      (секция subsystems) — список подсистем объекта.'
    input_schema:
      type: object
      properties:
        metaType:
          type: string
          description: Тип объекта метаданных
          enum:
          - Catalogs
          - Documents
          - InformationRegisters
          - AccumulationRegisters
          - AccountingRegisters
          - CalculationRegisters
          - Reports
          - DataProcessors
          - ChartsOfCharacteristicTypes
          - ChartsOfAccounts
          - ChartsOfCalculationTypes
          - BusinessProcesses
          - Tasks
          - ExchangePlans
          - Enums
        name:
          type: string
          description: Точное имя объекта метаданных (без учета регистра)
        sections:
          type: array
          description: Секции вывода. fields=поля (стандартные+реквизиты+измерения+ресурсы),
            tabular_sections=ТЧ, predefined=предопределенные, owners=владельцы, register_records=регистры
            движений (только для документов), subsystems=подсистемы прямого вхождения.
            По умолчанию все, кроме predefined и subsystems. Для Enums применяется
            только subsystems.
          items:
            type: string
            enum:
            - fields
            - tabular_sections
            - predefined
            - owners
            - register_records
            - subsystems
        maxTypesInComposite:
          type: number
          description: Лимит типов составного реквизита (0 - без лимита)
          default: 10
      required:
      - metaType
      - name
    domain_tags: []
  - tool_id: mcp__drivemcp__get_stock_levels
    server_name: drivemcp
    display_name: get_stock_levels
    description: 'READ: остатки номенклатуры Drive. Ключ словаря — UUID ссылки Products.
      Envelope: status, stock.{uuid}.{ref,sku,code,description,quantity,reorder_point,max_stock,below_reorder_point,inbound,projected_quantity,suggested_qty,base_demand_per_day}.'
    input_schema:
      type: object
      properties:
        sku:
          type: string
          description: GUID ссылки Catalog.Products. Пусто — все позиции.
        maxItems:
          type: number
          description: Максимальное количество SKU в ответе
          default: 200
    domain_tags: []
  - tool_id: mcp__drivemcp__get_reorder_points
    server_name: drivemcp
    display_name: get_reorder_points
    description: 'READ: точка заказа (PricingBalanceMin) и максимальный запас (PricingBalanceMax).
      Ключ словаря — UUID ссылки Products. Envelope: status, reorder_points.{uuid}.{ref,sku,code,description,quantity,reorder_point,max_stock,below_reorder_point,inbound,projected_quantity,remaining_capacity,suggested_qty,default_supplier_id,default_supplier_ref}.
      Триггер: below_reorder_point=true.'
    input_schema:
      type: object
      properties: *id001
    domain_tags: []
  - tool_id: mcp__drivemcp__get_replenishment_needs
    server_name: drivemcp
    display_name: get_replenishment_needs
    description: 'READ / основной триггер закупки: только номенклатура ниже точки
      заказа с suggested_qty>0. Ключ словаря — UUID ссылки Products. Envelope: status,
      needs_replenishment, items.{uuid}.{ref,sku,code,description,quantity,reorder_point,max_stock,suggested_qty,remaining_capacity,default_supplier_id,default_supplier_ref}.'
    input_schema:
      type: object
      properties: *id002
    domain_tags: []
  - tool_id: mcp__drivemcp__get_suppliers
    server_name: drivemcp
    display_name: get_suppliers
    description: 'READ: поставщики Drive (Counterparties.Supplier) и цены (CounterpartyPrices).
      Ключ словаря — UUID ссылки Counterparties. Envelope: status, suppliers.{uuid}.{ref,code,description,reliability,unit_price,lead_time_days,reputation,is_defaulted,status,offers.{product_uuid}.{ref,sku,code,description,unit_price,lead_time_days}}.'
    input_schema:
      type: object
      properties:
        supplier_id:
          type: string
          description: GUID ссылки Catalog.Counterparties. Пусто — все поставщики.
            Пусто — все поставщики.
        maxItems:
          type: number
          description: Максимальное количество поставщиков в ответе
          default: 200
    domain_tags: []
  - tool_id: mcp__drivemcp__get_budget
    server_name: drivemcp
    display_name: get_budget
    description: 'READ: свободные деньги Drive (CashAssets.Amount) и загрузка бюджета
      (CashBudget за период). Envelope NOWA: status, remaining, utilization_ratio.'
    input_schema:
      type: object
      properties:
        period_start:
          type: string
          description: Начало периода оборотов CashBudget (ISO-дата). По умолчанию
            — начало текущего месяца.
        period_end:
          type: string
          description: Конец периода оборотов CashBudget (ISO-дата). По умолчанию
            — конец текущего месяца.
    domain_tags: []
  - tool_id: mcp__drivemcp__create_purchase_order
    server_name: drivemcp
    display_name: create_purchase_order
    description: 'WRITE: создаёт Document.PurchaseOrder. Поставщик и номенклатура
      — только GUID Catalog.Counterparties / Catalog.Products. Envelope: status=accepted|error,
      params, document_number, document_ref.'
    input_schema:
      type: object
      properties:
        supplier_id:
          type: string
          description: GUID ссылки Catalog.Counterparties
        product_id:
          type: string
          description: GUID ссылки Catalog.Products. Синоним параметра sku.
        sku:
          type: string
          description: Синоним product_id — GUID ссылки Catalog.Products.
        qty:
          type: number
          description: Количество заказа
        strategy:
          type: string
          description: Метаданные решения NOWA (пишется в Comment, Drive не интерпретирует).
        confidence:
          type: number
          description: Уверенность решения NOWA (пишется в Comment).
        post:
          type: boolean
          description: Провести документ после записи. По умолчанию false — только
            запись.
          default: false
        force:
          type: boolean
          description: Пропустить проверки точки заказа и максимального запаса. По
            умолчанию false.
          default: false
      required:
      - supplier_id
      - sku
      - qty
    domain_tags: []
  tools:
  - *id003
  - *id004
